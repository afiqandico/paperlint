[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlint"
version = "0.1.0"
description = "Deterministic pre-submission gates for manuscripts and research repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Afiq Andico Pangimpian" }]
keywords = [
  "research",
  "manuscript",
  "latex",
  "reproducibility",
  "audit",
  "peer-review",
  "ci",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# python-docx: `manuscript docx-structure` and `manuscript docx-restyle`
docx = ["python-docx>=1.1"]
# matplotlib + Pillow: `manuscript figure`
figures = ["matplotlib>=3.7", "Pillow>=10"]
# PyYAML: `repo ci` (without it the YAML checks are skipped, never silently passed)
ci = ["PyYAML>=6"]
all = ["python-docx>=1.1", "matplotlib>=3.7", "Pillow>=10", "PyYAML>=6"]

[project.urls]
Homepage = "https://github.com/afiqandico/paperlint"

[project.scripts]
paperlint = "paperlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
