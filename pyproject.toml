[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperlint"
version = "0.1.0"
description = "Deterministic pre-submission gates for manuscripts and research repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Afiq Andico Pangimpian" }]
keywords = [
  "research",
  "manuscript",
  "latex",
  "reproducibility",
  "audit",
  "peer-review",
  "ci",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# python-docx: `manuscript docx-structure` and `manuscript docx-restyle`
docx = ["python-docx>=1.1"]
# matplotlib + Pillow: `manuscript figure`
figures = ["matplotlib>=3.7", "Pillow>=10"]
# PyYAML: `repo ci` (without it the YAML checks are skipped, never silently passed)
ci = ["PyYAML>=6"]
all = ["python-docx>=1.1", "matplotlib>=3.7", "Pillow>=10", "PyYAML>=6"]
dev = ["pytest>=8", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/afiqandico/paperlint"

[project.scripts]
paperlint = "paperlint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Jalankan `pytest` langsung dari checkout tanpa `pip install -e .`:
# paket ada di src/ (src-layout), jadi tambahkan ke sys.path lewat konfigurasi.
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned so CI does not drift when ruff changes its default rule set.
select = ["E", "F", "W", "I", "B", "C4", "SIM", "RUF", "ISC", "FURB"]
ignore = ["E501"]

